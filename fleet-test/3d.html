<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>現場地圖（大螢幕）</title>
<link rel="icon" href="../img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Huninn&family=Lilita+One&family=Potta+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<style>
  /* 大螢幕（2026-10-17）：第二個螢幕全螢幕用；活動看板的現場地圖點了什麼，這裡跟著飛過去打開（同一台電腦的兩個視窗） */
  html, body { height: 100%; margin: 0; overflow: hidden; }
  .bighead { display: flex; align-items: center; gap: 14px; padding: 8px 16px; background: var(--red); color: #fff; border-bottom: 4px solid var(--yellow); height: 56px; box-sizing: border-box; }
  .bighead h1 { margin: 0; font-size: 22px; font-family: "Lilita One", "Potta One", "Huninn", sans-serif; font-weight: 400; }
  .bighead .bclock { margin-left: auto; font-family: "Bangers", "Huninn", sans-serif; font-size: 22px; color: var(--yellow); letter-spacing: 1px; }
  .bighead button { min-height: 0; padding: 4px 12px; }
  .amapbig { position: absolute; top: 56px; left: 0; right: 0; bottom: 0; margin: 0; border: 0; border-radius: 0; box-shadow: none; display: flex; flex-direction: column; }
  .amapbig .chead { display: none; }
  .amapbig .amapbar { position: absolute; top: 10px; left: 60px; z-index: 3; padding: 0; }
  .amapbig .amapwrap { flex: 1; display: block; position: relative; padding: 0; }
  .amapbig .amapmap { position: absolute; inset: 0; height: auto; border: 0; border-radius: 0; }
  .amapbig .amapside { position: absolute; top: 12px; right: 12px; width: min(560px, 40vw); max-height: calc(100% - 24px); z-index: 3; box-shadow: var(--shadow); font-size: 18px; }
  .amapbig .amappin { font-size: 15px; }
  .amapbig .amapcmd { position: absolute; top: 104px; left: 12px; z-index: 3; width: 300px; background: rgba(255,255,255,.94); border: var(--line); border-radius: 12px; padding: 10px 12px; box-shadow: var(--shadow); }
  .amapbig .amapcmd .note { display: none; }
  .amapbig .amapsub { display: none; }
  .amapbig .amapside:not(.sel) { display: none; }
  .amapbig .amapspots { position: absolute; top: 54px; left: 60px; z-index: 3; padding: 0; }
  .bnote { display: none; position: absolute; left: 12px; bottom: 12px; z-index: 3; background: rgba(255,255,255,.9); border-radius: 8px; padding: 4px 10px; font-size: 13px; }
</style>
</head>
<body>
<div class="bighead"><h1 id="bTitle">🗺 現場地圖</h1><button class="ghost" id="bFull">全螢幕</button><span class="bclock" id="bClock"></span></div>
<div id="bBox"></div>
<p class="bnote">在活動看板的現場地圖點車輛、監視器、直播，這裡會自動飛過去放大（要在同一台電腦開兩個視窗）。</p>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
</script>
<script src="../cctv.js"></script>
<script src="../activity-data.js"></script>
<script src="../actmap.js"></script>
<script>
// 哪個活動：?act=活動 id；沒給就用最近一個有現場地圖的活動
const q = new URLSearchParams(location.search).get("act");
const act = ACTIVITIES.find((x) => x.id === q && x.map) || [...ACTIVITIES].filter((x) => x.map).sort((a, b) => (a.date < b.date ? 1 : -1))[0];
if (!act) $("#bBox").innerHTML = `<p class="note" style="padding:24px">目前沒有設定現場地圖的活動。</p>`;
else {
  $("#bTitle").textContent = "🗺 " + act.title;
  document.title = act.title + "｜現場地圖（大螢幕）";
  $("#bBox").innerHTML = `<div class="acam amap amapbig" id="actMap-${act.id}"></div>`;
  drawAmap(act);
}
$("#bFull").addEventListener("click", () => { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); });
const tick = () => { $("#bClock").textContent = new Intl.DateTimeFormat("zh-TW", { timeZone: "Asia/Taipei", hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23" }).format(new Date()); };
tick(); setInterval(tick, 1000);
</script>
</body>
</html>
