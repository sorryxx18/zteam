<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>車輛動態（測試）</title>
<link rel="icon" href="../img/favicon.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --ink: #1a1a1a; --bg: #eaf3ff; --card: #fff; --muted: #5b6573; --red: #d6302b; --yellow: #ffd23f; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Noto Sans TC", "PingFang TC", sans-serif; background: var(--bg); color: var(--ink); }
  header { background: var(--red); color: #fff; padding: 10px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 20px; }
  header .tag { background: var(--yellow); color: var(--ink); border-radius: 6px; padding: 1px 8px; font-size: 13px; font-weight: 700; }
  .wrap { display: grid; grid-template-columns: 1fr 320px; gap: 12px; padding: 12px 16px; }
  #map { height: calc(100vh - 90px); min-height: 420px; border: 3px solid var(--ink); border-radius: 12px; }
  aside { display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--card); border: 3px solid var(--ink); border-radius: 12px; padding: 10px 12px; }
  .card h2 { margin: 0 0 8px; font-size: 16px; }
  .note { color: var(--muted); font-size: 13px; margin: 4px 0; }
  .car { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px dashed #bbb; cursor: pointer; }
  .car:last-child { border-bottom: 0; }
  .car b { font-size: 15px; }
  .age { font-size: 13px; white-space: nowrap; }
  .age.ok { color: #1a7f37; } .age.warn { color: #b26b00; } .age.old { color: var(--red); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chips button { border: 2px solid var(--ink); background: #fff; border-radius: 16px; padding: 2px 10px; font-size: 14px; cursor: pointer; }
  .chips button.on { background: var(--yellow); }
  code { background: #f2f4f7; padding: 1px 5px; border-radius: 4px; word-break: break-all; }
  .lbl { background: var(--ink); color: #fff; border-radius: 6px; padding: 1px 6px; font-size: 12px; font-weight: 700; white-space: nowrap; border: 2px solid #fff; }
  .lbl.stale { background: #8a94a3; }
  @media (max-width: 760px) { .wrap { grid-template-columns: 1fr; padding: 8px; } #map { height: 60vh; } }
</style>
</head>
<body>
<header><h1>🚒 車輛動態</h1><span class="tag">測試版</span><span id="upd" style="font-size:13px"></span></header>
<div class="wrap">
  <div id="map"></div>
  <aside>
    <div class="card"><h2>回報中的車輛 <span id="cnt"></span></h2><div id="cars"><p class="note">載入中…</p></div>
      <p class="note">綠色＝1 分鐘內有回報；橘色＝5 分鐘內；紅色＝超過 5 分鐘沒回報。點車號會移到那台車。</p></div>
    <div class="card"><h2>軌跡長度</h2><div class="chips" id="mins"></div></div>
    <div class="card"><h2>手機設定（Traccar Client）</h2>
      <p class="note">1. Play 商店搜尋並安裝「Traccar Client」。</p>
      <p class="note">2. 打開 App，「裝置識別碼」改成車號，例如 <code>信義91</code>。</p>
      <p class="note">3. 「伺服器網址」填：<br><code id="srv"></code></p>
      <p class="note">4. 定位頻率設 15～30 秒，精確度選「高」，按「開始」。位置權限選「一律允許」，並把 App 從省電最佳化排除。</p>
    </div>
  </aside>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const API = "https://script.google.com/macros/s/AKfycbzSyTTFT7Vz1Z1Cr64hhixU7xvdJpgJ30BK14ZOhv2jh0LJX6REFSfh_-HL9D3hs2iN/exec";
document.getElementById("srv").textContent = API;
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const map = L.map("map").setView([25.0339, 121.5645], 15);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "&copy; OpenStreetMap" }).addTo(map);
let minutes = 60, layers = {}, fitted = false, data = null;
const MINS = [[15, "15 分鐘"], [60, "1 小時"], [180, "3 小時"], [720, "12 小時"]];
function chips() {
  document.getElementById("mins").innerHTML = MINS.map(([m, n]) => `<button data-m="${m}" class="${m === minutes ? "on" : ""}">${n}</button>`).join("");
}
document.getElementById("mins").addEventListener("click", (e) => { const b = e.target.closest("[data-m]"); if (!b) return; minutes = Number(b.dataset.m); chips(); load(); });
const ago = (t) => { const s = Math.max(0, Math.round((Date.now() - t) / 1000)); return s < 60 ? `${s} 秒前` : s < 3600 ? `${Math.floor(s / 60)} 分鐘前` : `${Math.floor(s / 3600)} 小時前`; };
const cls = (t) => { const s = (Date.now() - t) / 1000; return s < 60 ? "ok" : s < 300 ? "warn" : "old"; };
async function load() {
  try {
    const r = await fetch(API, { method: "POST", body: JSON.stringify({ action: "fleet_data", minutes }) });
    data = await r.json(); if (!data.ok) throw new Error(data.error);
    draw();
    document.getElementById("upd").textContent = "資料更新 " + new Date().toLocaleTimeString("zh-TW", { hour12: false });
  } catch (e) { document.getElementById("upd").textContent = "讀取失敗，15 秒後重試"; }
}
function draw() {
  const seen = new Set();
  data.cars.forEach((c) => {
    seen.add(c.device);
    // 手機可能重送同一筆：同一時間點只留一個
    const pts = []; c.track.forEach((p) => { if (!pts.length || pts[pts.length - 1][2] !== p[2]) pts.push(p); });
    const pos = [c.last.lat, c.last.lng], stale = cls(c.last.t) === "old";
    const icon = L.divIcon({ className: "", html: `<span class="lbl${stale ? " stale" : ""}">🚒 ${esc(c.device)}</span>`, iconAnchor: [10, 10] });
    const pop = `<b>${esc(c.device)}</b><br>最後回報：${ago(c.last.t)}<br>${c.last.speed !== "" ? `速度：${Math.round(c.last.speed * 3.6)} km/h<br>` : ""}${c.last.acc !== "" ? `精確度：約 ${c.last.acc} 公尺<br>` : ""}${c.last.batt !== "" ? `手機電量：${Math.round(c.last.batt)}%` : ""}`;
    let l = layers[c.device];
    if (!l) { l = layers[c.device] = { m: L.marker(pos, { icon }).addTo(map), line: L.polyline([], { color: "#d6302b", weight: 4, opacity: 0.6 }).addTo(map) }; }
    l.m.setLatLng(pos).setIcon(icon).bindPopup(pop);
    l.line.setLatLngs(pts.map((p) => [p[0], p[1]]));
  });
  Object.keys(layers).forEach((d) => { if (!seen.has(d)) { map.removeLayer(layers[d].m); map.removeLayer(layers[d].line); delete layers[d]; } });
  if (!fitted && data.cars.length) { map.fitBounds(L.latLngBounds(data.cars.map((c) => [c.last.lat, c.last.lng])).pad(0.3), { maxZoom: 16 }); fitted = true; }
  const list = [...data.cars].sort((a, b) => b.last.t - a.last.t);
  document.getElementById("cnt").textContent = `（${list.length} 台）`;
  document.getElementById("cars").innerHTML = list.length ? list.map((c) => `<div class="car" data-d="${esc(c.device)}"><b>🚒 ${esc(c.device)}</b><span class="age ${cls(c.last.t)}">${ago(c.last.t)}</span></div>`).join("")
    : `<p class="note">這段時間沒有車輛回報。</p>`;
}
document.getElementById("cars").addEventListener("click", (e) => { const r = e.target.closest("[data-d]"); if (!r || !layers[r.dataset.d]) return; const l = layers[r.dataset.d]; map.setView(l.m.getLatLng(), 17); l.m.openPopup(); });
chips(); load(); setInterval(load, 15000); setInterval(() => data && draw(), 5000);
</script>
</body>
</html>
