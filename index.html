<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Z-TEAM 防火任務板</title>
<link rel="icon" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Huninn&family=Lilita+One&family=Potta+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="traffic.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<header>
  <div class="brand">
    <img src="img/emblem.webp" alt="第二救災救護大隊隊徽" class="emblem">
    <div>
      <h1>Z-TEAM 防火任務板<span>第二大隊</span></h1>
      <div class="sub">臺北市政府消防局 第二救災救護大隊</div>
    </div>
  </div>
  <div id="who" hidden><span id="whoName"></span> <button id="adminBtn" class="ghost" hidden>⚙ 管理</button> <button id="export">匯出 Excel</button> <button id="logout" class="ghost">登出</button></div>
</header>

<div id="loginWrap" hidden><section id="login" class="card narrow">
  <h2>登入</h2>
  <p class="note">請用 Gmail 帳號登入。第一次登入需選擇所屬單位，經管理者核准後即可使用。</p>
  <div id="gbtn"></div>
  <div id="register" hidden>
    <p>第一次登入（<span id="regEmail"></span>），請填寫：</p>
    <label>姓名 <input id="regName"></label>
    <label>所屬單位
      <select id="regUnit">
        <option value="">請選擇</option>
        <optgroup label="中隊（百貨 A1 平面圖）"><option>大安中隊</option><option>信義中隊</option><option>南港中隊</option></optgroup>
        <optgroup label="分隊（訪視與住警器）"><option>金華分隊</option><option>莊敬分隊</option><option>安和分隊</option><option>舊莊分隊</option></optgroup>
      </select>
    </label>
    <button id="regBtn">送出申請</button>
  </div>
  <p id="loginErr" class="err"></p>
  <button id="backAct" class="ghost" hidden>← 回免登入的看板</button>
</section></div>

<main id="app" hidden>
  <div id="taskbar" class="taskbar"></div>
  <nav id="tabs"></nav>
  <div id="status" class="sub"></div>
  <section id="view"></section>
</main>
<script src="config.js"></script>
<script src="activity-data.js"></script>
<script src="activity.js"></script>
<script src="watch.js"></script>
<script src="traffic.js"></script>
<script src="app.js"></script>
<script src="dome.js"></script>
</body>
</html>
